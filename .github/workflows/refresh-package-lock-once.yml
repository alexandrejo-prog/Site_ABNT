name: Refresh package lock once

on:
  push:
    branches:
      - feat/pdf-import-v2.10.0-rebuild
    paths:
      - .github/workflows/refresh-package-lock-once.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/pdf-import-v2.10.0-rebuild

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile with optional dependencies
        run: npm install --package-lock-only --include=optional --ignore-scripts

      - name: Validate clean install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package.json; then
            echo "package.json changed unexpectedly"
            git diff -- package.json
            exit 1
          fi

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: sincronizar package-lock para ci"
          git push origin HEAD:feat/pdf-import-v2.10.0-rebuild
