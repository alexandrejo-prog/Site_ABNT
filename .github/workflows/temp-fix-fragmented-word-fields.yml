name: Temporary fix fragmented Word fields

on:
  push:
    branches:
      - feat/pdf-import-acceptance-pipeline

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/pdf-import-acceptance-pipeline
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/acceptance/docx-audit-core.mjs')
          text = path.read_text(encoding='utf-8')
          old = '      if (building) acc += " " + t[2];'
          new = '      if (building) acc += t[2];'
          occurrences = text.count(old)
          if occurrences != 1:
              raise SystemExit(f'Expected exactly one target line, found {occurrences}.')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Verify JavaScript syntax
        run: node --check scripts/acceptance/docx-audit-core.mjs

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-fragmented-word-fields.yml
          git add scripts/acceptance/docx-audit-core.mjs
          git diff --cached --check
          git commit -m "fix: reconstruir campos Word fragmentados"
          git push origin HEAD:feat/pdf-import-acceptance-pipeline
