name: Temporary DOCX audit test

on:
  push:
    branches:
      - feat/pdf-import-acceptance-pipeline

permissions:
  contents: write

jobs:
  test-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/pdf-import-acceptance-pipeline
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run DOCX acceptance auditor tests
        run: npx vitest run tests/acceptance-docx-audit.test.ts

      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-test-docx-audit.yml
          git commit -m "chore: remover workflow temporario de teste"
          git push origin HEAD:feat/pdf-import-acceptance-pipeline
