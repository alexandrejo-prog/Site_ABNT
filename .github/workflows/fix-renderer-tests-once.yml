name: Fix and validate PDF renderer tests once

on:
  push:
    branches:
      - feat/pdf-import-v2.10.0-rebuild
    paths:
      - .github/workflows/fix-renderer-tests-once.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-import-v2.10.0-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fix assertions, validate, and clean temporary files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/pdf-visual-asset-renderer.test.ts')
          text = path.read_text(encoding='utf-8')
          old_fields = '''  width: number;\n  height: number;\n  drawCalls: unknown[][] = [];'''
          new_fields = '''  width: number;\n  height: number;\n  readonly initialWidth: number;\n  readonly initialHeight: number;\n  drawCalls: unknown[][] = [];'''
          old_ctor = '''  constructor(width: number, height: number) {\n    this.width = width;\n    this.height = height;\n  }'''
          new_ctor = '''  constructor(width: number, height: number) {\n    this.width = width;\n    this.height = height;\n    this.initialWidth = width;\n    this.initialHeight = height;\n  }'''
          replacements = [
              (old_fields, new_fields),
              (old_ctor, new_ctor),
              ('expect(outputCanvas.width).toBe(800);', 'expect(outputCanvas.initialWidth).toBe(800);'),
              ('expect(outputCanvas.height).toBe(400);', 'expect(outputCanvas.initialHeight).toBe(400);'),
              ('expect(h.canvases[1].width).toBe(1600);', 'expect(h.canvases[1].initialWidth).toBe(1600);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          CI_STATUS=$?
          npx vitest run tests/pdf-visual-asset-renderer.test.ts > /tmp/focused.log 2>&1
          FOCUSED_STATUS=$?
          npm test > /tmp/tests.log 2>&1
          TEST_STATUS=$?
          npm run build > /tmp/build.log 2>&1
          BUILD_STATUS=$?
          git diff --check > /tmp/diff-check.log 2>&1
          DIFF_STATUS=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$CI_STATUS" -eq 0 ] && [ "$FOCUSED_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ] && [ "$DIFF_STATUS" -eq 0 ]; then
            rm -f REMOTE_RENDERER_VALIDATION.txt
            rm .github/workflows/fix-renderer-tests-once.yml
            git add tests/pdf-visual-asset-renderer.test.ts REMOTE_RENDERER_VALIDATION.txt .github/workflows/fix-renderer-tests-once.yml
            git commit -m "test: corrigir validacao de dimensoes do renderizador pdf"
          else
            git restore tests/pdf-visual-asset-renderer.test.ts
            {
              echo "npm_ci=$CI_STATUS"
              echo "focused_test=$FOCUSED_STATUS"
              echo "full_test=$TEST_STATUS"
              echo "build=$BUILD_STATUS"
              echo "diff_check=$DIFF_STATUS"
              echo
              echo "=== focused tail ==="
              tail -n 100 /tmp/focused.log
              echo
              echo "=== full test tail ==="
              tail -n 100 /tmp/tests.log
              echo
              echo "=== build tail ==="
              tail -n 100 /tmp/build.log
              echo
              echo "=== npm ci tail ==="
              tail -n 50 /tmp/npm-ci.log
              echo
              echo "=== diff check ==="
              cat /tmp/diff-check.log
            } > REMOTE_RENDERER_VALIDATION.txt
            rm .github/workflows/fix-renderer-tests-once.yml
            git add REMOTE_RENDERER_VALIDATION.txt .github/workflows/fix-renderer-tests-once.yml
            git commit -m "chore: registrar nova falha do renderizador pdf"
          fi
          git push origin HEAD:feat/pdf-import-v2.10.0-rebuild
